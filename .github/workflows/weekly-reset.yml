name: Weekly Reset

on:
  schedule:
    # Runs every Thursday at 00:00 UTC
    - cron: '0 0 * * 4'
  workflow_dispatch: # Allows manual triggering

jobs:
  reset-week:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Archive current week and update config
        run: python scripts/weekly_reset.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/archive.json data/week-config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly reset: Archive week ${{ env.WEEK_ID }} and update config" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
